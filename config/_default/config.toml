baseURL = 'https://aslielectronics.com/'
locale = "en-us"
title = "Asli Electronics | Premium Security & Smart Solutions in Qatar"
enableRobotsTXT = true
enableEmoji = true
timeout = "30s"

defaultContentLanguage = "en"
removePathAccents = true
pluralizeListTitles = false

[permalinks]
blog = "/blog/:slug/"
products = "/products/:slug/"

[taxonomies]
tag = "tags"
category = "categories"

paginate = 12

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[params]
author = "AsliElectronics"
description = "Qatar's trusted source for security cameras, CCTV systems, networking equipment, smart home automation, and audio solutions. MOI-approved products with professional installation across Doha."
default_og_image = "/images/products/secuview-wifi-outdoor-weatherproof-security-camera-0.jpg"
email = "info@aslielectronics.com"
phone = "+974 7741 8754"
whatsapp_number = "+97477418754"
displaySearchIcon = true
displayDarkMode = true
currency = "QAR"

ignoreLogs = ['warning-goldmark-raw-html']

api_endpoint = "https://api.web3forms.com/submit"
web3forms_access_key = "ef829179-0d0f-4287-a9fa-dd9546d0486b"

[params.analytics]
enabled = false
googleAnalyticsID = ""

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true

[security]
  enableInlineShortcodes = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    codeFences = true

[menu]
  [[menu.main]]
    name = "Products"
    url = "/categories/"
    weight = 1
  [[menu.main]]
    name = "Security"
    url = "/categories/security-surveillance/"
    weight = 2
  [[menu.main]]
    name = "Networking"
    url = "/categories/networking/"
    weight = 3
  [[menu.main]]
    name = "Smart Home"
    url = "/categories/smart-home/"
    weight = 4
  [[menu.main]]
    name = "Services"
    url = "/maintenance/"
    weight = 7
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 8
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 9
