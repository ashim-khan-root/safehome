baseURL = 'https://aslielectronics.com'
languageCode = "en-us"
title = "AsliElectronics Store"
enableRobotsTXT = true
enableEmoji = true
timeout = "30s"

defaultContentLanguage = "en"
removePathAccents = true
pluralizeListTitles = false

[permalinks]
blog = "/blog/:year/:month/:day/:slug/"
products = "/products/:slug/"

[taxonomies]
tag = "tags"
category = "categories"

paginate = 12

[outputs]
home = ["HTML", "RSS"]
section = ["HTML", "RSS"]

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[params]
author = "AsliElectronics"
description = "Qatar's trusted source for authentic security, networking, audio, and smart home solutions."
default_og_image = "/images/products/secuview-wifi-outdoor-weatherproof-security-camera-0.jpg"
email = "info@aslielectronics.com"
phone = "+974 7741 8754"
whatsapp_number = "+97477418754"
displaySearchIcon = true
displayDarkMode = true
currency = "QAR"

[params.analytics]
enabled = false
googleAnalyticsID = ""

ignoreLogs = ['warning-goldmark-raw-html']

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true

[security]
  enableInlineShortcodes = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokai"
    codeFences = true

[menu]
  [[menu.main]]
    name = "Products"
    url = "/categories/"
    weight = 1
  [[menu.main]]
    name = "Security"
    url = "/categories/security-surveillance/"
    weight = 2
  [[menu.main]]
    name = "Networking"
    url = "/categories/network--communications/"
    weight = 3
  [[menu.main]]
    name = "Smart Home"
    url = "/categories/smart-home/"
    weight = 4
  [[menu.main]]
    name = "Services"
    url = "/maintenance/"
    weight = 7
  [[menu.main]]
    name = "Blog"
    url = "/blog/"
    weight = 8
  [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 9
