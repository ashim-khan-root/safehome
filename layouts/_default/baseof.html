<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ partial "seo-meta" . }}
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="alternate" hreflang="{{ .Site.Language.Lang }}" href="{{ .Permalink }}">
    <link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
    <link rel="stylesheet" href="{{ (resources.Get "css/output.css").RelPermalink }}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
        (function () {
            var DARK_FROM = 18;
            var DARK_UNTIL = 5;

            function explicitChoice() {
                var stored = localStorage.getItem('theme');
                return stored === 'dark' || stored === 'light' ? stored : null;
            }

            function isDarkByTime() {
                var hour = new Date().getHours();
                return hour >= DARK_FROM || hour < DARK_UNTIL;
            }

            function apply() {
                var chosen = explicitChoice();
                var isDark = chosen
                    ? chosen === 'dark'
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches || isDarkByTime());
                document.documentElement.classList.toggle('dark', isDark);
                return isDark;
            }

            window.ASLI_THEME = {
                isAuto: function () { return explicitChoice() === null; },
                apply: apply
            };

            apply();
        })();
    </script>
</head>
<body class="bg-light-bg text-dark-slate dark:bg-slate-900 dark:text-slate-100">
    {{ partial "header" . }}
    <main class="min-h-screen">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer" . }}
    {{ partial "whatsapp-button" . }}
    <script src="{{ (resources.Get "js/dark-mode.js").RelPermalink }}"></script>
    <script src="{{ (resources.Get "js/ecommerce.js").RelPermalink }}"></script>
    <script>
      window.ASLI_CHATBOT_CONFIG = {
        apiEndpoint: "{{ .Site.Params.api_endpoint }}",
        accessKey: "{{ .Site.Params.web3forms_access_key }}",
        baseUrl: "{{ .Site.BaseURL }}",
        phoneNumber: "{{ .Site.Params.phone }}",
        email: "{{ .Site.Params.email }}",
        whatsappNumber: "{{ replaceRE "[^0-9]" "" .Site.Params.whatsapp_number }}",
      }
    </script>
    <script src="{{ (resources.Get "js/asli-chatbot-widget.js").RelPermalink }}"></script>
    {{ if .Site.Params.analytics.enabled }}
        {{ partial "analytics" . }}
    {{ end }}
    {{ block "scripts" . }}{{ end }}
</body>
</html>
