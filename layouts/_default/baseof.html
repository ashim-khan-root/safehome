<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ .Site.Params.description }}">
    {{ partial "seo-meta" . }}
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="stylesheet" href="{{ (resources.Get "css/output.css").RelPermalink }}">
    <link rel="icon" type="image/svg+xml" href="/favicon.ico">
    <script>
        // Dark mode persistence
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    {{ partial "header" . }}
    <main class="min-h-screen">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer" . }}
    <script src="{{ (resources.Get "js/dark-mode.js").RelPermalink }}"></script>
    <script src="{{ (resources.Get "js/search.js" | js.Build).RelPermalink }}"></script>
    {{ if .Site.Params.comments.enabled }}
        {{ partial "comments" . }}
    {{ end }}
    {{ if .Site.Params.analytics.enabled }}
        {{ partial "analytics" . }}
    {{ end }}
</body>
</html>
