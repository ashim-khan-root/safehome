<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {{ partial "seo-meta" . }}
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="stylesheet" href="{{ (resources.Get "css/output.css").RelPermalink }}">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="alternate icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>
</head>
<body class="bg-light-bg text-dark-slate dark:bg-slate-900 dark:text-slate-100">
    {{ partial "header" . }}
    <main class="min-h-screen">
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer" . }}
    {{ partial "whatsapp-button" . }}
    <script src="{{ (resources.Get "js/dark-mode.js").RelPermalink }}"></script>
    <script src="{{ (resources.Get "js/ecommerce.js").RelPermalink }}"></script>
    {{ if .Site.Params.analytics.enabled }}
        {{ partial "analytics" . }}
    {{ end }}
</body>
</html>
