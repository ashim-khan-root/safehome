{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl md:text-5xl font-serif font-bold mb-8">{{ .Title }}</h1>
    
    <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        {{ range .Data.Terms.ByCount }}
            <a 
                href="{{ .Page.Permalink }}" 
                class="p-6 card text-center hover:shadow-lg transition-shadow"
            >
                <h3 class="font-serif font-bold text-xl mb-2">{{ .Page.Title }}</h3>
                <p class="text-slate-600 dark:text-slate-400">
                    {{ len .Pages }} {{ if eq (len .Pages) 1 }}post{{ else }}posts{{ end }}
                </p>
            </a>
        {{ end }}
    </div>
</div>
{{ end }}
