<div class="border-t border-b border-slate-200 dark:border-slate-700 py-6 my-8">
    <p class="text-sm font-semibold text-slate-900 dark:text-slate-100 mb-4">Share this post</p>
    <div class="flex gap-4">
        <a 
            href="https://twitter.com/intent/tweet?url={{ .Permalink }}&text={{ .Title }}"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-secondary"
        >
            <span>Share on Twitter</span>
        </a>
        
        <a 
            href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-secondary"
        >
            <span>Share on LinkedIn</span>
        </a>
    </div>
</div>
