<header class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
            <a href="{{ .Site.BaseURL }}" class="text-xl font-serif font-bold text-slate-900 dark:text-white hover:text-primary-600 transition-colors">
                {{ .Site.Title }}
            </a>
            {{ partial "nav" . }}
        </div>
    </div>
</header>
