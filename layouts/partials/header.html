<div class="bg-dark-slate text-white text-xs text-center py-1.5 px-4">
  Free Shipping on orders over 500 QAR | Support: {{ .Site.Params.phone }} | 24/7 Customer Service
</div>
<header class="sticky top-0 z-50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-soft-gray/30 shadow-sm">
  <div class="container-site">
    <div class="flex items-center justify-between h-16">
      <div class="flex items-center gap-6">
          <a href="{{ .Site.BaseURL }}" class="flex items-center gap-1.5 text-xl font-bold tracking-tight">
            <span class="text-accent-blue">Asli</span><span class="text-dark-slate dark:text-white">Electronics</span>
          </a>
        {{ partial "nav" . }}
      </div>
      <div class="flex items-center gap-2">
        <div class="hidden md:block relative">
          <form action="{{ .Site.BaseURL }}categories/" method="get" class="relative">
            <input type="text" name="q" placeholder="Search products..." class="input !py-1.5 !pl-9 !pr-3 !text-sm !w-48 lg:!w-64 !rounded-full !bg-light-bg !border-soft-gray">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-soft-gray" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </form>
        </div>
        <button class="p-2 hover:bg-light-bg dark:hover:bg-slate-700 rounded-full relative" aria-label="Wishlist">
          <svg class="w-5 h-5 text-dark-slate dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
          </svg>
        </button>
        <button class="p-2 hover:bg-light-bg dark:hover:bg-slate-700 rounded-full relative" aria-label="Cart">
          <svg class="w-5 h-5 text-dark-slate dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"></path>
          </svg>
          <span id="cart-count" class="absolute -top-0.5 -right-0.5 bg-accent-blue text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center transition-transform">0</span>
        </button>
        {{ if .Site.Params.displayDarkMode }}
        <button id="theme-toggle" class="p-2 hover:bg-light-bg dark:hover:bg-slate-700 rounded-full">
          <svg id="sun-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l-1.414-1.414a2 2 0 10-2.828 0l-1.414 1.414a6 6 0 108.485-8.485l-1.414 1.414a4 4 0 10-5.657 5.657z" clip-rule="evenodd"></path>
          </svg>
          <svg id="moon-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
          </svg>
        </button>
        {{ end }}
        <button id="mobile-menu-toggle" class="md:hidden p-2 hover:bg-light-bg dark:hover:bg-slate-700 rounded-full" aria-label="Menu">
          <svg class="w-5 h-5 text-dark-slate dark:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>
  <div id="mobile-menu" class="hidden md:hidden border-t border-soft-gray/30 bg-white dark:bg-slate-900">
    <div class="container-site py-4 space-y-1">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" class="block px-3 py-2 rounded-lg text-sm text-dark-slate dark:text-white hover:bg-light-bg dark:hover:bg-slate-700 font-medium">{{ .Name }}</a>
      {{ end }}
      <form action="{{ .Site.BaseURL }}categories/" method="get" class="mt-3 px-3">
        <input type="text" name="q" placeholder="Search products..." class="input !py-2 !text-sm">
      </form>
    </div>
  </div>
</header>
