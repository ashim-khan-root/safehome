<title>{{ .Title }}{{ if not .IsHome }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Summary | plainify | truncate 155 }}">

{{ with .Params.keywords }}<meta name="keywords" content="{{ . }}">{{ end }}

<!-- Open Graph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Summary | plainify | truncate 155 }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
{{ with .Params.image }}<meta property="og:image" content="{{ $.Site.BaseURL }}{{ slicestr . 1 }}">{{ end }}

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Summary | plainify | truncate 155 }}">
{{ with .Params.image }}<meta name="twitter:image" content="{{ $.Site.BaseURL }}{{ slicestr . 1 }}">{{ end }}
{{ if .Site.Params.twitter }}<meta name="twitter:creator" content="@{{ .Site.Params.twitter }}">{{ end }}

<!-- Article metadata -->
{{ if .IsPage }}
    <meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
    {{ with .Lastmod }}<meta property="article:modified_time" content="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
    {{ range .Params.tags }}<meta property="article:tag" content="{{ . }}">{{ end }}
{{ end }}
