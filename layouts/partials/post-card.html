<article class="card">
    {{ if .Params.image }}
        <div class="aspect-video overflow-hidden bg-slate-200">
            <img 
                src="{{ .Site.BaseURL }}{{ slicestr .Params.image 1 }}" 
                alt="{{ .Title }}"
                class="w-full h-full object-cover hover:scale-105 transition-transform duration-300"
                loading="lazy"
            >
        </div>
    {{ end }}
    
    <div class="p-6">
        {{ if .Params.featured }}
            <span class="inline-block mb-2 text-xs font-bold text-primary-600 uppercase tracking-widest">Featured</span>
        {{ end }}
        
        <h3 class="text-xl font-serif font-bold mb-2">
            <a href="{{ .Permalink }}" class="hover:text-primary-600 transition-colors">
                {{ .Title }}
            </a>
        </h3>
        
        <p class="text-slate-600 dark:text-slate-400 mb-4 line-clamp-2">
            {{ .Summary | plainify }}
        </p>
        
        <div class="flex items-center justify-between">
            <span class="text-sm text-slate-500 dark:text-slate-500">
                {{ .PublishDate.Format "Jan 2, 2006" }}
            </span>
            <a href="{{ .Permalink }}" class="text-sm font-semibold text-primary-600 hover:text-primary-700">
                Read More →
            </a>
        </div>
    </div>
</article>
