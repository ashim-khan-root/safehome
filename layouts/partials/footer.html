<footer class="bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 mt-16">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-8">
            <div>
                <h3 class="font-serif font-bold text-lg mb-4">{{ .Site.Title }}</h3>
                <p class="text-slate-600 dark:text-slate-400">{{ .Site.Params.description }}</p>
            </div>
            <div>
                <h4 class="font-semibold mb-4">Quick Links</h4>
                <ul class="space-y-2 text-slate-600 dark:text-slate-400">
                    <li><a href="{{ .Site.BaseURL }}blog/" class="hover:text-primary-600">Blog</a></li>
                    <li><a href="{{ .Site.BaseURL }}about/" class="hover:text-primary-600">About</a></li>
                    <li><a href="{{ .Site.BaseURL }}contact/" class="hover:text-primary-600">Contact</a></li>
                </ul>
            </div>
            <div>
                <h4 class="font-semibold mb-4">Follow</h4>
                <div class="flex gap-4">
                    {{ if .Site.Params.twitter }}
                        <a href="https://twitter.com/{{ .Site.Params.twitter }}" class="text-slate-600 dark:text-slate-400 hover:text-primary-600">Twitter</a>
                    {{ end }}
                    {{ if .Site.Params.github }}
                        <a href="https://github.com/{{ .Site.Params.github }}" class="text-slate-600 dark:text-slate-400 hover:text-primary-600">GitHub</a>
                    {{ end }}
                </div>
            </div>
        </div>
        <div class="border-t border-slate-200 dark:border-slate-700 pt-8 text-center text-slate-600 dark:text-slate-400 text-sm">
            <p>&copy; {{ now.Year }} {{ .Site.Title }}. All rights reserved.</p>
        </div>
    </div>
</footer>
