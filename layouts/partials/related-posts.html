{{ $tags := .Params.tags }}
{{ if $tags }}
    {{ $related := where .Site.RegularPages "Params.tags" "intersect" $tags | first 3 }}
    {{ if $related }}
        <aside class="mt-12 pt-8 border-t border-slate-200 dark:border-slate-700">
            <h3 class="text-2xl font-serif font-bold mb-6">Related Posts</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                {{ range $related }}
                    {{ partial "post-card" . }}
                {{ end }}
            </div>
        </aside>
    {{ end }}
{{ end }}
