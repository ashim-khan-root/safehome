{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
    <h1 class="text-4xl md:text-5xl font-serif font-bold mb-8">Search</h1>
    
    <div class="mb-8">
        <div class="relative">
            <input 
                type="search"
                id="search-input"
                placeholder="Search articles..."
                class="input text-lg py-3"
            >
            <span class="absolute right-4 top-3 text-slate-400">
                🔍
            </span>
        </div>
    </div>
    
    <div id="search-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Results appear here -->
    </div>
    
    <p id="no-results" class="text-center text-slate-600 dark:text-slate-400 mt-8">
        Start typing to search...
    </p>
</div>

<script>
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    const noResults = document.getElementById('no-results');
    
    searchInput.addEventListener('input', async (e) => {
        const query = e.target.value.trim();
        
        if (query.length < 2) {
            searchResults.innerHTML = '';
            noResults.style.display = 'block';
            return;
        }
        
        const results = window.performSearch(query);
        
        if (results.length === 0) {
            searchResults.innerHTML = '';
            noResults.textContent = 'No results found.';
            noResults.style.display = 'block';
            return;
        }
        
        noResults.style.display = 'none';
        searchResults.innerHTML = results.map(result => `
            <a href="${result.url}" class="card">
                <div class="p-6">
                    <h3 class="text-lg font-serif font-bold mb-2">${result.title}</h3>
                    <p class="text-sm text-slate-600 dark:text-slate-400 line-clamp-2">${result.content.substring(0, 100)}...</p>
                </div>
            </a>
        `).join('');
    });
</script>
{{ end }}
