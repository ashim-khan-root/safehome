{{- $src := .Get "src" -}}
{{- $alt := .Get "alt" -}}
{{- $caption := .Get "caption" -}}
{{- $class := .Get "class" -}}

<figure class="my-8">
    <img 
        src="{{ $src }}" 
        alt="{{ $alt }}"
        class="w-full rounded-lg shadow-lg {{ $class }}"
        loading="lazy"
        width="800" height="450"
        onerror="this.src='https://placehold.co/800x450/e2e8f0/64748b?text=No+Image'"
    >
    {{ if $caption }}
        <figcaption class="text-sm text-slate-600 dark:text-slate-400 text-center mt-3 italic">
            {{ $caption }}
        </figcaption>
    {{ end }}
</figure>
